name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: __POLICY_OWNER__/eng-policies/.github/workflows/deploy.yml@__POLICY_REF__
    with:
      package-manager: "__PACKAGE_MANAGER__"
      install-command: "__INSTALL_CMD__"
      # Optional: set these once the Workers have URLs, to add health checks that gate production.
      # staging-url: "https://__APP_NAME__-staging.<your-subdomain>.workers.dev"
      # production-url: "https://__APP_NAME__.<your-subdomain>.workers.dev"
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

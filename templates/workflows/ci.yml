name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id MUST stay `ci`: the ruleset requires the check named "ci / gate".
  ci:
    uses: __POLICY_OWNER__/eng-policies/.github/workflows/ci.yml@__POLICY_REF__
    with:
      package-manager: "__PACKAGE_MANAGER__"
      install-command: "__INSTALL_CMD__"
      lint-command: "__LINT_CMD__"
      lint-mode: "__LINT_MODE__"
      typecheck-command: "__TYPECHECK_CMD__"
      typecheck-mode: "__TYPECHECK_MODE__"
      unit-command: "__UNIT_CMD__"
      integration-command: "__INTEGRATION_CMD__"
      build-command: "__BUILD_CMD__"
      audit-command: "__AUDIT_CMD__"
      # Python code in the project? Uncomment and adjust:
      # python-version: "3.12"
      # python-requirements: "requirements.txt"
      # python-test-command: "python -m unittest discover -s tests"
      # python-lint-command: "ruff check ."
      # Supabase / Postgres instead of D1 (ADR 0001 in eng-policies):
      # db-engine: "postgres"
      # package.json in a subfolder? Also set install-command (for example "cd web && npm ci")
      # and node-cache-path: "web/package-lock.json"

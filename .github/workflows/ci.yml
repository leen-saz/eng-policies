name: CI (reusable)

# Call from a project:
#   jobs:
#     ci:                     # the job id MUST be `ci`: the required check is named "ci / gate"
#       uses: <owner>/eng-policies/.github/workflows/ci.yml@v1
#       with: { ... }
#
# Stages run in order and fail fast:
#   lint -> typecheck -> unit -> integration -> build -> migrations -> security -> gate
# Python projects: set python-version, python-requirements and python-test-command (tests run in the unit stage),
# and python-lint-command (for example `ruff check .`) which follows lint-mode.
# Database: db-engine `d1` (default, wrangler local D1) or `postgres` (Supabase and other Postgres: every
# migration is applied in file-name order to a throwaway Postgres container).
# A project can set lint-mode / typecheck-mode to `warn-only` (brownfield adoption).

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      node-version:
        type: string
        default: "22"
      node-cache-path:
        description: "Lockfile path for the Node cache, relative to the repo root. Empty = <working-directory>/<lockfile of the package manager>. Set it when package.json is in a subfolder but working-directory is '.'"
        type: string
        default: ""
      python-version:
        description: "Empty = no Python. Set (for example '3.12') for projects that have Python code"
        type: string
        default: ""
      python-requirements:
        description: "requirements file to install and cache on, relative to the repo root (empty = install nothing)"
        type: string
        default: ""
      python-test-command:
        description: "Python tests, run in the unit stage (for example: python -m unittest discover -s tests). Empty skips"
        type: string
        default: ""
      python-lint-command:
        description: "Python lint, run in the lint stage and governed by lint-mode (for example: ruff check .). Empty skips"
        type: string
        default: ""
      python-lint-version:
        description: "ruff version installed when python-lint-command is set"
        type: string
        default: "0.14.3"
      package-manager:
        description: "npm | pnpm | yarn (used for dependency caching)"
        type: string
        default: "npm"
      install-command:
        type: string
        default: "npm ci"
      lint-command:
        description: "Empty string skips the stage"
        type: string
        default: "npm run lint"
      lint-mode:
        description: "block | warn-only"
        type: string
        default: "block"
      typecheck-command:
        type: string
        default: "npm run typecheck"
      typecheck-mode:
        description: "block | warn-only"
        type: string
        default: "block"
      unit-command:
        type: string
        default: "npm run test:unit"
      integration-command:
        type: string
        default: "npm run test:integration"
      build-command:
        type: string
        default: "npm run build"
      audit-command:
        type: string
        default: "npm audit --audit-level=high"
      migrations-dir:
        type: string
        default: "migrations"
      migration-env:
        description: "wrangler environment used for the local D1 migration check"
        type: string
        default: "staging"
      d1-binding:
        description: "D1 binding name in wrangler.jsonc"
        type: string
        default: "DB"
      db-engine:
        description: "d1 | postgres. postgres applies every *.sql in migrations-dir, sorted by name, to a throwaway Postgres"
        type: string
        default: "d1"
      postgres-version:
        description: "Postgres image tag for db-engine postgres (match your Supabase major version)"
        type: string
        default: "17"
      secret-scan-full-history:
        description: "true = scan the whole git history, false = scan only the commits of this run"
        type: boolean
        default: false
      gitleaks-version:
        type: string
        default: "8.30.1"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.node-cache-path != '' && inputs.node-cache-path || format('{0}/{1}', inputs.working-directory, inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || inputs.package-manager == 'yarn' && 'yarn.lock' || 'package-lock.json') }}
      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}
      - uses: actions/setup-python@v6
        if: inputs.python-version != ''
        with:
          python-version: ${{ inputs.python-version }}
          cache: ${{ inputs.python-requirements != '' && 'pip' || '' }}
          cache-dependency-path: ${{ inputs.python-requirements }}
      - name: Install Python requirements
        if: inputs.python-version != '' && inputs.python-requirements != ''
        run: python -m pip install -r "${{ inputs.python-requirements }}"
      - name: Lint
        id: lint
        if: inputs.lint-command != ''
        continue-on-error: ${{ inputs.lint-mode == 'warn-only' }}
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.lint-command }}
      - name: Install ruff
        if: inputs.python-lint-command != ''
        env:
          RUFF_VERSION: ${{ inputs.python-lint-version }}
        run: python3 -m pip install --user "ruff==${RUFF_VERSION}"
      - name: Python lint
        id: pylint
        if: inputs.python-lint-command != ''
        continue-on-error: ${{ inputs.lint-mode == 'warn-only' }}
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.python-lint-command }}
      - name: Lint is warn-only
        if: steps.lint.outcome == 'failure' || steps.pylint.outcome == 'failure'
        run: echo "::warning title=lint (warn-only)::Lint failed but lint-mode is warn-only. Track the cleanup in docs/adoption/PROGRESS.md."

  typecheck:
    name: typecheck
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.node-cache-path != '' && inputs.node-cache-path || format('{0}/{1}', inputs.working-directory, inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || inputs.package-manager == 'yarn' && 'yarn.lock' || 'package-lock.json') }}
      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}
      - name: Typecheck
        id: typecheck
        if: inputs.typecheck-command != ''
        continue-on-error: ${{ inputs.typecheck-mode == 'warn-only' }}
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.typecheck-command }}
      - name: Typecheck is warn-only
        if: steps.typecheck.outcome == 'failure'
        run: echo "::warning title=typecheck (warn-only)::Typecheck failed but typecheck-mode is warn-only. Track the cleanup in docs/adoption/PROGRESS.md."

  unit:
    name: unit
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.node-cache-path != '' && inputs.node-cache-path || format('{0}/{1}', inputs.working-directory, inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || inputs.package-manager == 'yarn' && 'yarn.lock' || 'package-lock.json') }}
      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}
      - uses: actions/setup-python@v6
        if: inputs.python-version != ''
        with:
          python-version: ${{ inputs.python-version }}
          cache: ${{ inputs.python-requirements != '' && 'pip' || '' }}
          cache-dependency-path: ${{ inputs.python-requirements }}
      - name: Install Python requirements
        if: inputs.python-version != '' && inputs.python-requirements != ''
        run: python -m pip install -r "${{ inputs.python-requirements }}"
      - name: Unit tests
        if: inputs.unit-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.unit-command }}
      - name: Python tests
        if: inputs.python-test-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.python-test-command }}

  integration:
    name: integration
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.node-cache-path != '' && inputs.node-cache-path || format('{0}/{1}', inputs.working-directory, inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || inputs.package-manager == 'yarn' && 'yarn.lock' || 'package-lock.json') }}
      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}
      - name: Integration tests
        if: inputs.integration-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.integration-command }}

  build:
    name: build
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.node-cache-path != '' && inputs.node-cache-path || format('{0}/{1}', inputs.working-directory, inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || inputs.package-manager == 'yarn' && 'yarn.lock' || 'package-lock.json') }}
      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}
      - uses: actions/setup-python@v6
        if: inputs.python-version != ''
        with:
          python-version: ${{ inputs.python-version }}
          cache: ${{ inputs.python-requirements != '' && 'pip' || '' }}
          cache-dependency-path: ${{ inputs.python-requirements }}
      - name: Install Python requirements
        if: inputs.python-version != '' && inputs.python-requirements != ''
        run: python -m pip install -r "${{ inputs.python-requirements }}"
      - name: Build
        if: inputs.build-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

  migrations:
    name: migrations
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Locate migrations and wrangler config
        id: locate
        working-directory: ${{ inputs.working-directory }}
        run: |
          cfg=""
          for f in wrangler.jsonc wrangler.json wrangler.toml; do
            if [ -f "$f" ]; then cfg="$f"; break; fi
          done
          if [ "${{ inputs.db-engine }}" = "postgres" ]; then
            if [ -d "${{ inputs.migrations-dir }}" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=migrations::No migrations dir found. Skipping the Postgres migration check."
            fi
          elif [ -z "$cfg" ] || [ ! -d "${{ inputs.migrations-dir }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=migrations::No wrangler config or migrations dir found. Skipping the D1 migration check."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Existing migrations must not be edited, renamed or deleted
        if: steps.locate.outputs.run == 'true' && github.event_name == 'pull_request'
        working-directory: ${{ inputs.working-directory }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MIG_DIR: ${{ inputs.migrations-dir }}
        run: |
          changed="$(git diff --name-status --no-renames "$BASE_SHA"...HEAD -- "$MIG_DIR" | awk '$1 != "A"' || true)"
          if [ -n "$changed" ]; then
            echo "::error title=immutable migrations::Merged migrations must never change. Add a new migration instead."
            echo "$changed"
            exit 1
          fi
      - uses: actions/setup-node@v6
        if: steps.locate.outputs.run == 'true' && inputs.db-engine == 'd1'
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.node-cache-path != '' && inputs.node-cache-path || format('{0}/{1}', inputs.working-directory, inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || inputs.package-manager == 'yarn' && 'yarn.lock' || 'package-lock.json') }}
      - run: corepack enable
        if: steps.locate.outputs.run == 'true' && inputs.db-engine == 'd1'
      - name: Install
        if: steps.locate.outputs.run == 'true' && inputs.db-engine == 'd1'
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}
      - name: Apply every migration to an ephemeral local D1
        if: steps.locate.outputs.run == 'true' && inputs.db-engine == 'd1'
        working-directory: ${{ inputs.working-directory }}
        env:
          CI: "true"
          NO_D1_WARNING: "true"
        run: |
          npx wrangler d1 migrations apply "${{ inputs.d1-binding }}" --env "${{ inputs.migration-env }}" --local
      - name: Show resulting tables
        if: steps.locate.outputs.run == 'true' && inputs.db-engine == 'd1'
        working-directory: ${{ inputs.working-directory }}
        env:
          NO_D1_WARNING: "true"
        run: |
          npx wrangler d1 execute "${{ inputs.d1-binding }}" --env "${{ inputs.migration-env }}" --local \
            --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
      - name: Apply every migration to a throwaway Postgres
        if: steps.locate.outputs.run == 'true' && inputs.db-engine == 'postgres'
        working-directory: ${{ inputs.working-directory }}
        env:
          PG_VERSION: ${{ inputs.postgres-version }}
          MIG_DIR: ${{ inputs.migrations-dir }}
        run: |
          set -euo pipefail
          docker run -d --name pg -e POSTGRES_PASSWORD=ci -p 5432:5432 "postgres:${PG_VERSION}" >/dev/null
          for _ in $(seq 1 30); do docker exec pg pg_isready -U postgres >/dev/null 2>&1 && break; sleep 1; done
          # Stand-ins for the Supabase roles and auth.* helpers that migrations reference, so GRANTs and RLS policies apply
          docker exec -i pg psql -v ON_ERROR_STOP=1 -U postgres -q <<'SQL'
          DO $$ BEGIN
            CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN BYPASSRLS;
          EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS 'SELECT NULL::uuid';
          CREATE OR REPLACE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE AS 'SELECT NULL::text';
          CREATE OR REPLACE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql STABLE AS 'SELECT NULL::jsonb';
          CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY, email text, created_at timestamptz DEFAULT now());
          CREATE SCHEMA IF NOT EXISTS vault;
          SQL
          # Stand-in for the supabase_vault extension (plain text, CI only), so `create extension supabase_vault`
          # and the vault.create_secret / update_secret / decrypted_secrets calls in migrations resolve
          ext="$(docker exec pg sh -c 'ls -d /usr/share/postgresql/*/extension | head -1')"
          docker exec -i pg sh -c "cat > $ext/supabase_vault.control" <<'EOF'
          comment = 'CI stand-in for Supabase Vault (plain text, never used with real secrets)'
          default_version = '0.0.0'
          relocatable = false
          schema = vault
          EOF
          docker exec -i pg sh -c "cat > $ext/supabase_vault--0.0.0.sql" <<'EOF'
          CREATE TABLE vault.secrets (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), name text UNIQUE, description text NOT NULL DEFAULT '', secret text NOT NULL, key_id uuid, nonce bytea, created_at timestamptz NOT NULL DEFAULT now(), updated_at timestamptz NOT NULL DEFAULT now());
          CREATE FUNCTION vault.create_secret(new_secret text, new_name text DEFAULT NULL, new_description text DEFAULT '', new_key_id uuid DEFAULT NULL) RETURNS uuid LANGUAGE sql AS $$ INSERT INTO vault.secrets (secret, name, description) VALUES (new_secret, new_name, new_description) RETURNING id $$;
          CREATE FUNCTION vault.update_secret(secret_id uuid, new_secret text DEFAULT NULL, new_name text DEFAULT NULL, new_description text DEFAULT NULL, new_key_id uuid DEFAULT NULL) RETURNS void LANGUAGE sql AS $$ UPDATE vault.secrets SET secret = coalesce(new_secret, secret), name = coalesce(new_name, name), description = coalesce(new_description, description), updated_at = now() WHERE id = secret_id $$;
          CREATE VIEW vault.decrypted_secrets AS SELECT *, secret AS decrypted_secret FROM vault.secrets;
          EOF
          shopt -s nullglob
          files=("$MIG_DIR"/*.sql)
          [ ${#files[@]} -gt 0 ] || { echo "::notice title=migrations::$MIG_DIR has no .sql files"; exit 0; }
          for f in $(printf '%s\n' "${files[@]}" | sort); do
            echo "applying $f"
            docker exec -i pg psql -v ON_ERROR_STOP=1 -U postgres -q -1 < "$f"
          done
          docker exec pg psql -U postgres -c "SELECT schemaname, tablename FROM pg_tables WHERE schemaname NOT IN ('pg_catalog','information_schema') ORDER BY 1,2"

  security:
    name: security
    needs: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
          FULL: ${{ inputs.secret-scan-full-history }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          mkdir -p "$RUNNER_TEMP/gitleaks" && tar -xzf gitleaks.tgz -C "$RUNNER_TEMP/gitleaks" gitleaks
          args=(git --no-banner --redact --verbose)
          if [ "$FULL" != "true" ]; then
            if [ -n "$BASE_SHA" ]; then
              args+=(--log-opts "${BASE_SHA}..HEAD")
            elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              args+=(--log-opts "${BEFORE_SHA}..HEAD")
            else
              args+=(--log-opts "-1")
            fi
          fi
          "$RUNNER_TEMP/gitleaks/gitleaks" "${args[@]}"
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.node-cache-path != '' && inputs.node-cache-path || format('{0}/{1}', inputs.working-directory, inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || inputs.package-manager == 'yarn' && 'yarn.lock' || 'package-lock.json') }}
      - name: Dependency audit
        if: inputs.audit-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.audit-command }}

  # The ONLY check a ruleset needs to require: "ci / gate".
  # Skipped jobs count as passing for required checks, so this job fails explicitly
  # when any earlier stage failed or was cancelled.
  gate:
    name: gate
    if: always()
    needs: [lint, typecheck, unit, integration, build, migrations, security]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every stage passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "stage results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error title=CI gate::At least one stage did not succeed."
              exit 1
            fi
          done

name: CI (reusable)

# Call from a project:
#   jobs:
#     ci:                     # the job id MUST be `ci`: the required check is named "ci / gate"
#       uses: <owner>/eng-policies/.github/workflows/ci.yml@v1
#       with: { ... }
#
# Stages run in order and fail fast:
#   lint -> typecheck -> unit -> integration -> build -> migrations -> security -> gate
# Python projects: set python-version, python-requirements and python-test-command (tests run in the unit stage).
# A project can set lint-mode / typecheck-mode to `warn-only` (brownfield adoption).

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      node-version:
        type: string
        default: "22"
      node-cache-path:
        description: "Lockfile path for the Node cache, relative to the repo root. Empty = <working-directory>/<lockfile of the package manager>. Set it when package.json is in a subfolder but working-directory is '.'"
        type: string
        default: ""
      python-version:
        description: "Empty = no Python. Set (for example '3.12') for projects that have Python code"
        type: string
        default: ""
      python-requirements:
        description: "requirements file to install and cache on, relative to the repo root (empty = install nothing)"
        type: string
        default: ""
      python-test-command:
        description: "Python tests, run in the unit stage (for example: python -m unittest discover -s tests). Empty skips"
        type: string
        default: ""
      package-manager:
        description: "npm | pnpm | yarn (used for dependency caching)"
        type: string
        default: "npm"
      install-command:
        type: string
        default: "npm ci"
      lint-command:
        description: "Empty string skips the stage"
        type: string
        default: "npm run lint"
      lint-mode:
        description: "block | warn-only"
        type: string
        default: "block"
      typecheck-command:
        type: string
        default: "npm run typecheck"
      typecheck-mode:
        description: "block | warn-only"
        type: string
        default: "block"
      unit-command:
        type: string
        default: "npm run test:unit"
      integration-command:
        type: string
        default: "npm run test:integration"
      build-command:
        type: string
        default: "npm run build"
      audit-command:
        type: string
        default: "npm audit --audit-level=high"
      migrations-dir:
        type: string
        default: "migrations"
      migration-env:
        description: "wrangler environment used for the local D1 migration check"
        type: string
        default: "staging"
      d1-binding:
        description: "D1 binding name in wrangler.jsonc"
        type: string
        default: "DB"
      secret-scan-full-history:
        description: "true = scan the whole git history, false = scan only the commits of this run"
        type: boolean
        default: false
      gitleaks-version:
        type: string
        default: "8.30.1"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.node-cache-path != '' && inputs.node-cache-path || format('{0}/{1}', inputs.working-directory, inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || inputs.package-manager == 'yarn' && 'yarn.lock' || 'package-lock.json') }}
      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}
      - uses: actions/setup-python@v6
        if: inputs.python-version != ''
        with:
          python-version: ${{ inputs.python-version }}
          cache: ${{ inputs.python-requirements != '' && 'pip' || '' }}
          cache-dependency-path: ${{ inputs.python-requirements }}
      - name: Install Python requirements
        if: inputs.python-version != '' && inputs.python-requirements != ''
        run: python -m pip install -r "${{ inputs.python-requirements }}"
      - name: Lint
        id: lint
        if: inputs.lint-command != ''
        continue-on-error: ${{ inputs.lint-mode == 'warn-only' }}
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.lint-command }}
      - name: Lint is warn-only
        if: steps.lint.outcome == 'failure'
        run: echo "::warning title=lint (warn-only)::Lint failed but lint-mode is warn-only. Track the cleanup in docs/adoption/PROGRESS.md."

  typecheck:
    name: typecheck
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.node-cache-path != '' && inputs.node-cache-path || format('{0}/{1}', inputs.working-directory, inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || inputs.package-manager == 'yarn' && 'yarn.lock' || 'package-lock.json') }}
      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}
      - name: Typecheck
        id: typecheck
        if: inputs.typecheck-command != ''
        continue-on-error: ${{ inputs.typecheck-mode == 'warn-only' }}
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.typecheck-command }}
      - name: Typecheck is warn-only
        if: steps.typecheck.outcome == 'failure'
        run: echo "::warning title=typecheck (warn-only)::Typecheck failed but typecheck-mode is warn-only. Track the cleanup in docs/adoption/PROGRESS.md."

  unit:
    name: unit
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.node-cache-path != '' && inputs.node-cache-path || format('{0}/{1}', inputs.working-directory, inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || inputs.package-manager == 'yarn' && 'yarn.lock' || 'package-lock.json') }}
      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}
      - uses: actions/setup-python@v6
        if: inputs.python-version != ''
        with:
          python-version: ${{ inputs.python-version }}
          cache: ${{ inputs.python-requirements != '' && 'pip' || '' }}
          cache-dependency-path: ${{ inputs.python-requirements }}
      - name: Install Python requirements
        if: inputs.python-version != '' && inputs.python-requirements != ''
        run: python -m pip install -r "${{ inputs.python-requirements }}"
      - name: Unit tests
        if: inputs.unit-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.unit-command }}
      - name: Python tests
        if: inputs.python-test-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.python-test-command }}

  integration:
    name: integration
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.node-cache-path != '' && inputs.node-cache-path || format('{0}/{1}', inputs.working-directory, inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || inputs.package-manager == 'yarn' && 'yarn.lock' || 'package-lock.json') }}
      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}
      - name: Integration tests
        if: inputs.integration-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.integration-command }}

  build:
    name: build
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.node-cache-path != '' && inputs.node-cache-path || format('{0}/{1}', inputs.working-directory, inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || inputs.package-manager == 'yarn' && 'yarn.lock' || 'package-lock.json') }}
      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}
      - uses: actions/setup-python@v6
        if: inputs.python-version != ''
        with:
          python-version: ${{ inputs.python-version }}
          cache: ${{ inputs.python-requirements != '' && 'pip' || '' }}
          cache-dependency-path: ${{ inputs.python-requirements }}
      - name: Install Python requirements
        if: inputs.python-version != '' && inputs.python-requirements != ''
        run: python -m pip install -r "${{ inputs.python-requirements }}"
      - name: Build
        if: inputs.build-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

  migrations:
    name: migrations
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Locate migrations and wrangler config
        id: locate
        working-directory: ${{ inputs.working-directory }}
        run: |
          cfg=""
          for f in wrangler.jsonc wrangler.json wrangler.toml; do
            if [ -f "$f" ]; then cfg="$f"; break; fi
          done
          if [ -z "$cfg" ] || [ ! -d "${{ inputs.migrations-dir }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=migrations::No wrangler config or migrations dir found. Skipping the D1 migration check."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Existing migrations must not be edited, renamed or deleted
        if: steps.locate.outputs.run == 'true' && github.event_name == 'pull_request'
        working-directory: ${{ inputs.working-directory }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MIG_DIR: ${{ inputs.migrations-dir }}
        run: |
          changed="$(git diff --name-status --no-renames "$BASE_SHA"...HEAD -- "$MIG_DIR" | awk '$1 != "A"' || true)"
          if [ -n "$changed" ]; then
            echo "::error title=immutable migrations::Merged migrations must never change. Add a new migration instead."
            echo "$changed"
            exit 1
          fi
      - uses: actions/setup-node@v6
        if: steps.locate.outputs.run == 'true'
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.node-cache-path != '' && inputs.node-cache-path || format('{0}/{1}', inputs.working-directory, inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || inputs.package-manager == 'yarn' && 'yarn.lock' || 'package-lock.json') }}
      - run: corepack enable
        if: steps.locate.outputs.run == 'true'
      - name: Install
        if: steps.locate.outputs.run == 'true'
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}
      - name: Apply every migration to an ephemeral local D1
        if: steps.locate.outputs.run == 'true'
        working-directory: ${{ inputs.working-directory }}
        env:
          CI: "true"
          NO_D1_WARNING: "true"
        run: |
          npx wrangler d1 migrations apply "${{ inputs.d1-binding }}" --env "${{ inputs.migration-env }}" --local
      - name: Show resulting tables
        if: steps.locate.outputs.run == 'true'
        working-directory: ${{ inputs.working-directory }}
        env:
          NO_D1_WARNING: "true"
        run: |
          npx wrangler d1 execute "${{ inputs.d1-binding }}" --env "${{ inputs.migration-env }}" --local \
            --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"

  security:
    name: security
    needs: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
          FULL: ${{ inputs.secret-scan-full-history }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          mkdir -p "$RUNNER_TEMP/gitleaks" && tar -xzf gitleaks.tgz -C "$RUNNER_TEMP/gitleaks" gitleaks
          args=(git --no-banner --redact --verbose)
          if [ "$FULL" != "true" ]; then
            if [ -n "$BASE_SHA" ]; then
              args+=(--log-opts "${BASE_SHA}..HEAD")
            elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              args+=(--log-opts "${BEFORE_SHA}..HEAD")
            else
              args+=(--log-opts "-1")
            fi
          fi
          "$RUNNER_TEMP/gitleaks/gitleaks" "${args[@]}"
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.node-cache-path != '' && inputs.node-cache-path || format('{0}/{1}', inputs.working-directory, inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || inputs.package-manager == 'yarn' && 'yarn.lock' || 'package-lock.json') }}
      - name: Dependency audit
        if: inputs.audit-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.audit-command }}

  # The ONLY check a ruleset needs to require: "ci / gate".
  # Skipped jobs count as passing for required checks, so this job fails explicitly
  # when any earlier stage failed or was cancelled.
  gate:
    name: gate
    if: always()
    needs: [lint, typecheck, unit, integration, build, migrations, security]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every stage passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "stage results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error title=CI gate::At least one stage did not succeed."
              exit 1
            fi
          done

name: CodeQL (reusable)

# Call on pull_request and on a weekly schedule.
# Note: code scanning on PRIVATE repositories needs GitHub Code Security. On a free private repo this job fails.
# Projects without it can simply not include the caller file.

on:
  workflow_call:
    inputs:
      languages:
        description: "Comma separated CodeQL languages"
        type: string
        default: "javascript-typescript"
      build-mode:
        type: string
        default: "none"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ inputs.languages }}
          build-mode: ${{ inputs.build-mode }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ inputs.languages }}"

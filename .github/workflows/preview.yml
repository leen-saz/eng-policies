name: Preview + E2E (reusable)

# Deploys every PR to a Cloudflare preview (Worker version with a preview alias),
# runs Playwright against that URL, and keeps one comment on the PR with the URL and result.
#
# The caller must grant:   permissions: { contents: read, pull-requests: write }
# The caller must pass:    secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# The project's wrangler.jsonc must define an `env.preview` with its own D1 + R2 (never staging or production).
# Fork PRs have no access to secrets, so they are skipped.

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      node-version:
        type: string
        default: "22"
      package-manager:
        type: string
        default: "npm"
      install-command:
        type: string
        default: "npm ci"
      build-command:
        description: "Empty string skips the build (Wrangler bundles the Worker itself)"
        type: string
        default: ""
      preview-env:
        description: "wrangler environment used for previews"
        type: string
        default: "preview"
      d1-binding:
        type: string
        default: "DB"
      migrations-dir:
        type: string
        default: "migrations"
      e2e-command:
        type: string
        default: "npx playwright test"
      health-path:
        type: string
        default: "/"
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: deploy-preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.upload.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: "true"
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || inputs.package-manager == 'yarn' && 'yarn.lock' || 'package-lock.json' }}
      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}
      - name: Build
        if: inputs.build-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}
      - name: Apply migrations to the preview database
        working-directory: ${{ inputs.working-directory }}
        env:
          BINDING: ${{ inputs.d1-binding }}
          PREVIEW_ENV: ${{ inputs.preview-env }}
          MIG_DIR: ${{ inputs.migrations-dir }}
        run: |
          if [ -d "$MIG_DIR" ]; then
            npx wrangler d1 migrations apply "$BINDING" --env "$PREVIEW_ENV" --remote
          else
            echo "No migrations directory, skipping."
          fi
      - name: Upload the preview version
        id: upload
        working-directory: ${{ inputs.working-directory }}
        env:
          PREVIEW_ENV: ${{ inputs.preview-env }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          alias="pr-${PR_NUMBER}"
          upload() {
            npx wrangler versions upload --env "$PREVIEW_ENV" --preview-alias "$alias" 2>&1 | tee upload.log
            return "${PIPESTATUS[0]}"
          }
          if ! upload; then
            # A Worker that was never deployed cannot receive versions: bootstrap it once, then retry.
            if grep -qiE "10007|not found|does not exist|doesn't exist" upload.log; then
              echo "::notice title=preview::Preview Worker does not exist yet. Deploying it once."
              npx wrangler deploy --env "$PREVIEW_ENV" || exit 1
              upload || exit 1
            else
              exit 1
            fi
          fi
          url="$(grep -Eo "https://${alias}-[A-Za-z0-9.-]+\.workers\.dev" upload.log | head -1 || true)"
          if [ -z "$url" ]; then
            echo "::error title=preview::Could not find the preview URL in the wrangler output. Check that preview URLs are enabled (preview_urls) and that the alias plus Worker name is at most 63 characters."
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
      - name: Comment the preview URL on the PR
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const marker = '<!-- eng-policies-preview -->';
            const body = `${marker}\n### Preview\n${process.env.PREVIEW_URL}\n\nE2E: running for \`${context.sha.slice(0, 7)}\``;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  e2e:
    name: e2e
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || inputs.package-manager == 'yarn' && 'yarn.lock' || 'package-lock.json' }}
      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}
      - name: Wait for the preview to answer
        env:
          URL: ${{ needs.deploy.outputs.url }}
          HEALTH: ${{ inputs.health-path }}
        run: |
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "${URL}${HEALTH}" || true)"
            echo "attempt $i: HTTP $code"
            if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then exit 0; fi
            sleep 4
          done
          echo "::error title=preview::The preview URL never answered."
          exit 1
      - name: Install Playwright browsers
        working-directory: ${{ inputs.working-directory }}
        run: npx playwright install --with-deps chromium
      - name: Run Playwright against the preview
        id: e2e
        working-directory: ${{ inputs.working-directory }}
        env:
          BASE_URL: ${{ needs.deploy.outputs.url }}
        run: ${{ inputs.e2e-command }}
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ${{ inputs.working-directory }}/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Update the PR comment with the E2E result
        if: always()
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.url }}
          RESULT: ${{ steps.e2e.outcome }}
        with:
          script: |
            const marker = '<!-- eng-policies-preview -->';
            const ok = process.env.RESULT === 'success';
            const body = `${marker}\n### Preview\n${process.env.PREVIEW_URL}\n\nE2E: ${ok ? 'passed' : 'FAILED'} for \`${context.sha.slice(0, 7)}\``;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
